name: Quick capture
about: Capture a cross-component idea or Fleet coordination item before full triage
labels: []
body:
  - type: textarea
    id: note
    attributes:
      label: Capture
      description: Record the idea, problem, dependency, or follow-up. Keep it short; it can be triaged later.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This appears to require both Vincent and CIC Station or applies at Fleet level.
          required: false
